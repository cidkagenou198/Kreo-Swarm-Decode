[project]
name = "kreo-control"
version = "0.1.0"
description = "Independent desktop controller for the Kreo Swarm 75 keyboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "hidapi>=0.14.0",
    "pydantic>=2.0.0",
    "mss>=10.2.0",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
kreo-probe = "kreo_control.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kreo_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
